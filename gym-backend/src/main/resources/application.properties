spring.application.name=gym-backend
spring.datasource.url=${GYM_DB_URL:jdbc:postgresql://localhost:5432/gym_db}
spring.datasource.username=${GYM_DB_USER:gym_app}
spring.datasource.password=${GYM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

gym.jwt.secret=${GYM_JWT_SECRET}
gym.jwt.expiracion-horas=8

gym.bootstrap.admin1.nombre=${GYM_ADMIN1_NOMBRE:}
gym.bootstrap.admin1.email=${GYM_ADMIN1_EMAIL:}
gym.bootstrap.admin1.password=${GYM_ADMIN1_PASSWORD:}
gym.bootstrap.admin2.nombre=${GYM_ADMIN2_NOMBRE:}
gym.bootstrap.admin2.email=${GYM_ADMIN2_EMAIL:}
gym.bootstrap.admin2.password=${GYM_ADMIN2_PASSWORD:}