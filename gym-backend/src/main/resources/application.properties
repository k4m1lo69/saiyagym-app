spring.application.name=gym-backend
spring.datasource.url=${GYM_DB_URL:jdbc:postgresql://localhost:5432/gym_db}
spring.datasource.username=${GYM_DB_USER:gym_app}
spring.datasource.password=${GYM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true